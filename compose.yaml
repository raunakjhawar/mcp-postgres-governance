services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mcpdemo
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Run scripts/local.ps1 first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - demo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap -d mcpdemo"]
      interval: 3s
      timeout: 3s
      retries: 30
  bootstrap:
    build: .
    profiles: ["init"]
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_MODE: local
      PGHOST: postgres
      PGDATABASE: mcpdemo
      PGUSER: bootstrap
      PGPASSWORD: ${LOCAL_ADMIN_PASSWORD:?Run scripts/local.ps1 first}
      LOCAL_RUNTIME_PASSWORD: ${LOCAL_RUNTIME_PASSWORD:?Run scripts/local.ps1 first}
      TENANT_ID: 11111111-1111-1111-1111-111111111111
      DEMO_USER_OID: 22222222-2222-2222-2222-222222222222
      RUNTIME_PRINCIPALS: '[{"name":"mcp_local"}]'
volumes:
  demo-postgres:
