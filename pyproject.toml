[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-postgresql-mcp-security"
version = "0.1.0"
description = "Public and private MCP endpoints backed by private Azure PostgreSQL."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.26,<2",
  "uvicorn>=0.35,<1",
  "psycopg[binary]>=3.2,<4",
  "azure-identity>=1.25,<2",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "msal>=1.34,<2",
  "certifi>=2025.1",
  "aiohttp>=3.12,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
